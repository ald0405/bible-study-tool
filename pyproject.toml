[project]
name = "bible-study-tool"
version = "0.1.0"
description = "Local multi-translation Bible study tool with quotation, discourse, tone, and cross-reference analysis"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "nltk>=3.8",
    "python-dotenv>=1.0",
    "spacy>=3.8.16",
    "en-core-web-sm",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
